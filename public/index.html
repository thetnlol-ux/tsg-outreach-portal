<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TSG Outreach Portal</title>
  <link rel="icon" type="image/png" href="/brand/favicon.png">
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      color-scheme: light dark;
      --paper:#F6F8FA;
      --surface:#FFFFFF;
      --ink:#0D1B2A;
      --sub:#565B60;
      --accent:#004B87;
      --accent-cyan:#00AEEF;
      --line:#D5E2EE;
      --radius-lg:18px;
      --shadow-md:0 10px 28px rgba(13,27,42,.10), 0 2px 6px rgba(13,27,42,.06);
    }
    @media (prefers-color-scheme: dark){
      :root{
        --paper:#0B1520; --surface:#122234; --ink:#EAF1F8; --sub:#A9B7C4;
        --accent:#3FA9F5; --accent-cyan:#3FD1FB; --line:#22384C;
        --shadow-md:0 10px 28px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
      }
    }
    *{box-sizing:border-box;}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--paper);
      color:var(--ink);
      font-family:"Roboto",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
      text-align:center;
      padding:24px;
    }
    .mark{
      display:flex;
      justify-content:center;
      margin-bottom:20px;
    }
    .mark img{ height:32px; width:auto; }
    .mark .logo-dark{ display:none; }
    @media (prefers-color-scheme: dark){
      .mark .logo-light{ display:none; }
      .mark .logo-dark{ display:block; }
    }
    h1{
      font-size:clamp(24px,4vw,34px);
      margin:0 0 10px;
      font-weight:700;
      letter-spacing:-0.01em;
    }
    p{
      color:var(--sub);
      margin:0;
      font-size:15px;
    }
    .card{
      max-width:420px;
      width:100%;
      padding:40px 32px;
      background:var(--surface);
      border-radius:var(--radius-lg);
      box-shadow:var(--shadow-md);
    }
    .signin{
      display:inline-block;
      margin-top:24px;
      padding:11px 22px;
      background:var(--accent);
      color:#fff;
      text-decoration:none;
      border-radius:999px;
      font-size:14px;
      font-weight:600;
      box-shadow:0 1px 2px rgba(13,27,42,.15);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">
      <img class="logo-light" src="/brand/tsgroup-logo-dark.svg" alt="TS Group">
      <img class="logo-dark" src="/brand/tsgroup-logo-white.svg" alt="TS Group">
    </div>
    <h1>Outreach Portal</h1>
    <p>Tapflo &amp; Sychem cold-lead outreach dashboard - internal use only.</p>
    <a class="signin" href="/auth/login">Sign in with Microsoft</a>
  </div>
</body>
</html>
